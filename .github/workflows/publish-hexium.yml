name: Publish to Hexium
run-name: Hexium ${{ inputs.release_id }} ${{ inputs.expected_version }}

on:
  workflow_dispatch:
    inputs:
      release_id: {description: Shared release train identifier, required: true, type: string}
      expected_version: {description: Version expected in package manifest, required: true, type: string}
      blog_url: {description: Published Ragnavik release blog URL, required: true, type: string}
      staged_release_tag: {description: Optional private draft release tag containing the exact package ZIP, required: false, type: string}
      publish: {description: Upload after validation, required: true, default: false, type: boolean}

permissions:
  contents: read

concurrency:
  group: hexium-ragnavik-ui
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    environment: hexium-production
    env:
      VALHEIM_MANAGED_DIR: ${{ vars.VALHEIM_MANAGED_DIR }}
      BEPINEX_CORE_DIR: ${{ vars.BEPINEX_CORE_DIR }}
      PACKAGE: artifacts/LostKode-Ragnavik_UI-${{ inputs.expected_version }}.zip
    steps:
      - uses: actions/checkout@v4
      - name: Download staged package
        if: inputs.staged_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p artifacts && gh release download "${{ inputs.staged_release_tag }}" --pattern "LostKode-Ragnavik_UI-${{ inputs.expected_version }}.zip" --dir artifacts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Resolve build references
        if: inputs.staged_release_tag == ''
        shell: bash
        run: |
          if [[ -d "${VALHEIM_MANAGED_DIR:-}" && -d "${BEPINEX_CORE_DIR:-}" ]]; then
            echo "Using build references provided by the runner."
            exit 0
          fi
          install_root="$RUNNER_TEMP/ragnavik-build-references"
          mkdir -p "$install_root/valheim" "$install_root/bepinex"
          docker run --rm --volume "$install_root/valheim:/data" steamcmd/steamcmd:ubuntu-22 \
            +force_install_dir /data +login anonymous +app_update 896660 validate +quit
          curl --fail --location --retry 3 \
            https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2350/ \
            --output "$install_root/bepinex.zip"
          unzip -q "$install_root/bepinex.zip" -d "$install_root/bepinex"
          managed_dir=$(find "$install_root/valheim" -type d -path '*/valheim_server_Data/Managed' -print -quit)
          bepinex_dir=$(find "$install_root/bepinex" -type d -path '*/BepInEx/core' -print -quit)
          test -n "$managed_dir"
          test -n "$bepinex_dir"
          echo "VALHEIM_MANAGED_DIR=$managed_dir" >> "$GITHUB_ENV"
          echo "BEPINEX_CORE_DIR=$bepinex_dir" >> "$GITHUB_ENV"
      - name: Build package
        if: inputs.staged_release_tag == ''
        run: |
          ./scripts/validate.sh
          ./scripts/package.sh
      - run: dotnet tool restore
      - name: Prepare Hexium release metadata
        run: >-
          python3 scripts/hexium_publish.py prepare
          --manifest package/manifest.json
          --package "$PACKAGE"
          --expected-version "${{ inputs.expected_version }}"
          --release-id "${{ inputs.release_id }}"
          --blog-url "${{ inputs.blog_url }}"
          --repository https://hexium.gg
          --category "Client-side" --category Mods --category Utility --category "Valheim 1.0"
          --output .tcli/hexium.toml
      - uses: actions/upload-artifact@v4
        with:
          name: LostKode-Ragnavik_UI-${{ inputs.expected_version }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
      - name: Require Hexium token for publication
        if: inputs.publish
        env:
          HEXIUM_AUTH_TOKEN: ${{ secrets.HEXIUM_AUTH_TOKEN }}
        run: test -n "$HEXIUM_AUTH_TOKEN"
      - name: Publish package
        if: inputs.publish
        env:
          HEXIUM_AUTH_TOKEN: ${{ secrets.HEXIUM_AUTH_TOKEN }}
        run: dotnet tool run tcli publish --config-path .tcli/hexium.toml --file "$PACKAGE" --token "$HEXIUM_AUTH_TOKEN"
      - name: Verify public package
        if: inputs.publish
        run: python3 scripts/hexium_publish.py verify --repository https://hexium.gg --name Ragnavik_UI --version "${{ inputs.expected_version }}"
