name: Prepare Hexium package
run-name: Hexium ${{ inputs.release_id }} ${{ inputs.expected_version }}

on:
  workflow_dispatch:
    inputs:
      release_id: {description: Shared release train identifier, required: true, type: string}
      expected_version: {description: Expected package version, required: true, type: string}
      blog_url: {description: Published Ragnavik release blog URL, required: true, type: string}
      publish: {description: Request upload after validation (currently fail closed), required: true, default: false, type: boolean}

permissions:
  contents: read

concurrency:
  group: hexium-ragnavik-ui
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    env:
      VALHEIM_MANAGED_DIR: ${{ vars.VALHEIM_MANAGED_DIR }}
      BEPINEX_CORE_DIR: ${{ vars.BEPINEX_CORE_DIR }}
      RAGNAVIK_ENTRY_ENVIRONMENT: Production
      RAGNAVIK_SERVER_ADDRESS: ${{ secrets.RAGNAVIK_SERVER_ADDRESS }}
      RAGNAVIK_SERVER_PORT: ${{ secrets.RAGNAVIK_SERVER_PORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Resolve build references
        shell: bash
        run: |
          if [[ -d "${VALHEIM_MANAGED_DIR:-}" && -d "${BEPINEX_CORE_DIR:-}" ]]; then
            echo "Using build references provided by the runner."
            exit 0
          fi

          install_root="$RUNNER_TEMP/ragnavik-build-references"
          reference_version="1.2214.6"
          reference_sha256="7b014ef8e605a251c6c3999f3c6a7e3ce1db59e7e0307733d4b80e3431893e86"
          mkdir -p "$install_root"
          curl --fail --location --retry 3 \
            "https://api.nuget.org/v3-flatcontainer/coffeenova.valheim.managedreferences/$reference_version/coffeenova.valheim.managedreferences.$reference_version.nupkg" \
            --output "$install_root/references.nupkg"
          echo "$reference_sha256  $install_root/references.nupkg" | sha256sum --check --strict
          unzip -q "$install_root/references.nupkg" -d "$install_root/package"
          reference_dir="$install_root/package/lib/net46"
          test -f "$reference_dir/assembly_valheim.dll"
          test -f "$reference_dir/BepInEx.dll"
          echo "VALHEIM_MANAGED_DIR=$reference_dir" >> "$GITHUB_ENV"
          echo "BEPINEX_CORE_DIR=$reference_dir" >> "$GITHUB_ENV"
      - run: ./scripts/validate.sh
      - run: ./scripts/package.sh
      - run: ./scripts/validate.sh
      - name: Validate Hexium artifact and release gate
        run: >-
          python3 scripts/hexium_release.py validate
          --manifest package/manifest.json
          --package "artifacts/LostKode-Ragnavik_UI-${{ inputs.expected_version }}.zip"
          --identity LostKode-Ragnavik_UI
          --expected-version "${{ inputs.expected_version }}"
          --release-id "${{ inputs.release_id }}"
          --blog-url "${{ inputs.blog_url }}"
      - name: Upload package
        if: inputs.publish
        run: >-
          python3 scripts/hexium_release.py upload
          --manifest package/manifest.json
          --package "artifacts/LostKode-Ragnavik_UI-${{ inputs.expected_version }}.zip"
          --identity LostKode-Ragnavik_UI
          --expected-version "${{ inputs.expected_version }}"
          --release-id "${{ inputs.release_id }}"
          --blog-url "${{ inputs.blog_url }}"
